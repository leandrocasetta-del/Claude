name: Build SecondBrain APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'SecondBrain/**'
      - '.github/workflows/build-secondbrain.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: SecondBrain
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SegundoCerebro-debug-${{ github.sha }}
          path: SecondBrain/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
