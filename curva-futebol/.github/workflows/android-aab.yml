name: Build Android AAB

on:
  push:
    branches: [ "claude/curva-futebol-android-aab-d24tlr" ]
    paths:
      - "curva-futebol/**"
  workflow_dispatch:

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

defaults:
  run:
    working-directory: curva-futebol

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Lock orientation to portrait
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'screenOrientation' "$MANIFEST"; then
            sed -i 's#<activity#<activity android:screenOrientation="portrait"#' "$MANIFEST"
          fi

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/curva-release.jks

      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: curva-futebol/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=curva-release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build debug AAB (fallback when no keystore secrets)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        working-directory: curva-futebol/android
        run: ./gradlew bundleDebug

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: curva-aab
          path: curva-futebol/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
