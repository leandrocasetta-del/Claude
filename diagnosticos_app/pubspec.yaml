name: diagnosticos_app
description: App de Centro de Diagnosticos - estudo de UI/UX (clone visual com dados mock).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  local_auth: ^2.2.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
