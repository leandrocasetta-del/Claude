name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: wealth_planner
        run: flutter pub get

      - name: Analyze code
        working-directory: wealth_planner
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        working-directory: wealth_planner
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WealthPlanner-${{ github.sha }}
          path: wealth_planner/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build APK (debug)
        if: github.event_name == 'pull_request'
        working-directory: wealth_planner
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WealthPlanner-debug-${{ github.sha }}
          path: wealth_planner/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
